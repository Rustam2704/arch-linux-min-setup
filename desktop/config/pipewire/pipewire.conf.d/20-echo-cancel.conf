# Echo cancellation for calls (Vesktop/Discord, Zoom): the built-in microphone hears
# the built-in speakers, and the other side heard themselves. PipeWire's WebRTC AEC
# makes a virtual "Microphone (echo cancelled)" source and a matching sink; both are
# the defaults, so every app that uses the default devices gets it. Costs a few
# percent of CPU only while audio flows.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.gain_control = false
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
            }
            capture.props = {
                node.name = "echo-cancel-capture"
                node.description = "Echo cancel capture (raw microphone)"
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Microphone (echo cancelled)"
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.description = "Speakers (echo cancelled)"
            }
            playback.props = {
                node.name = "echo-cancel-playback"
                node.description = "Echo cancel playback (to speakers)"
            }
        }
    }
]
