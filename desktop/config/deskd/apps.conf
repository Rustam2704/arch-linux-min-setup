# deskd favorites: apps for "Launch favorites" and their fixed workspaces.
# Edited by the Apple-button menu (saved instantly) - hand edits are fine too.
#   desktop / command : what to start      class : window class for the workspace rule
#   workspace         : empty = anywhere   enabled : included in "Launch favorites"

[settings]
launch_at_login = true
popup_apps = firefox-developer-edition

[Telegram]
desktop = org.telegram.desktop.desktop
class = TelegramDesktop
workspace = 2
enabled = true

[Firefox]
desktop = firefox-developer-edition.desktop
class = firefox-developer-edition
workspace = 4
enabled = true

[Sublime Text]
desktop = sublime_text.desktop
class = Sublime_text
workspace = 2
enabled = true

[kitty]
desktop = kitty.desktop
class = kitty
workspace = 1
enabled = true

[light-year]
desktop = light-year.desktop
class = light-year
workspace = 3
enabled = true

