# picom — tuned for Intel HD 5000: shadows + fade + transparency, NO blur
backend = "glx";
vsync = true;
# Whole-frame swaps: with damage tracking the front buffer is patched region by
# region and a screen grab (Zoom's share) in the middle of it shows a torn frame.
# A full repaint only when something changes, a few ms of GPU on this Intel.
use-damage = false;

# shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "@COLOUR_BACKGROUND@";
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'deskd'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@[0] = '_NET_WM_STATE_HIDDEN'"
];

# fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [ "class_g = 'Xfce4-panel'" ];

# transparency — light touch
inactive-opacity = 1.0;          # no window transparency (user, 23.09)
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "100:class_g = 'firefox-developer-edition'",
  "100:class_g = 'Vlc'",
  "100:class_g = 'obs'",
  "100:fullscreen",
  "100:class_g = 'Rofi'",
  "100:class_g = 'SkyStars'",
  "100:class_g = 'light-year'"
];

# behaviour
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;      # full-screen video/games bypass the compositor
# Zoom's screen share puts a screen-sized border frame on top, and its annotation
# canvas is a screen-sized 32-bit window. Neither may switch the compositor off:
# without it every translucent window (the annotation canvas itself, our overlays)
# is drawn as a solid black box - the user got a black screen until a workspace
# switch repainted it.
unredir-if-possible-exclude = [ "name = 'cpt_frame_xcb_window'", "class_g = 'zoom'" ];
corner-radius = 6;
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "class_g = 'i3-frame'", "class_g = 'deskd'" ];

# Dark mode for Zoom (it has none on Linux): brightness inverted, hues kept.
# Main window and its Settings only — never the meeting window, so video stays normal.
window-shader-fg-rule = [
  "@HOME@/.config/picom/shaders/smart-invert.glsl:class_g = 'zoom' && name ^= 'Zoom Workplace'",
  "@HOME@/.config/picom/shaders/smart-invert.glsl:class_g = 'zoom' && name = 'Settings'"
];
