# Round 75 (owner decision 15.10): the desktop stays above the agents. Every kitty window's
# shell runs in its own transient scope (kitty-<pid>-<n>.scope, directly under user@1000.service);
# Claude Code, Codex and all their children live there. Without this a scope weighs as much as
# all of app.slice (Firefox, deskd, panel daemons): CPUWeight 10 against the default 100, and
# MemoryHigh makes one runaway window throttle and swap before it can starve the desktop.
# A prefix drop-in applies to transient scopes, running ones included after daemon-reload.
[Scope]
CPUWeight=10
MemoryHigh=4G
