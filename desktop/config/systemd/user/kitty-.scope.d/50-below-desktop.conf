# Owner decision 15.10: terminals (and the agents in them) yield the CPU to the desktop, without
# any cap. Every kitty window's shell runs in its own transient scope (kitty-<pid>-<n>.scope,
# directly under user@1000.service); Claude Code, Codex and all their children live there.
# CPUWeight is a priority, not a limit: it only matters while both sides want the CPU at once,
# otherwise a terminal gets all the CPU it asks for. 50 against the default 100 of app.slice
# (Firefox, deskd, panel daemons) = the desktop gets twice a window's share in a contest, about
# what `nice -n 3` would give. Round 75 had 10 plus MemoryHigh=4G - too hard, owner asked for a
# lower priority only. A prefix drop-in applies to transient scopes, running ones after daemon-reload.
[Scope]
CPUWeight=50
