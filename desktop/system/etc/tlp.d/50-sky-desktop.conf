# Sky desktop: TLP's profiles on this MacBookPro11,1 (Haswell, intel_cpufreq in passive
# mode). Chosen in the battery menu (osd menu power); "Automatic" = performance on the
# charger, balanced on battery (TLP's defaults).
#
# Power saver: no turbo and the CPU capped at 60 % of its range - the two cores stay near
# their most efficient clock; schedutil still raises the clock inside that cap under load.
# Deepest PCIe link power saving (Wi-Fi card, SSD), a little latency on wake.
CPU_BOOST_ON_SAV=0
CPU_MAX_PERF_ON_SAV=60
PCIE_ASPM_ON_SAV=powersupersave
#
# The other profiles set the same knobs back explicitly: TLP leaves a knob alone when its
# profile has no value for it, so leaving power saver would keep the cap.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
