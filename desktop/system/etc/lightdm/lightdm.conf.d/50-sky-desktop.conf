# Straight into the "Xfce + i3" session, no greeter, no session chooser (user's choice).
# The session entry is /usr/share/xsessions/xfce-i3.desktop (desktop/system); the user must
# be in the "autologin" group: groupadd -r autologin; gpasswd -a <user> autologin
[Seat:*]
autologin-user=@USER@
autologin-user-timeout=0
autologin-session=xfce-i3
