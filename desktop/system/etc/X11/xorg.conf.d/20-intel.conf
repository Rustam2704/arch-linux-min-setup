# Haswell HD 5100 on the intel (SNA) driver instead of modesetting+glamor (round 65, 14.10.2026):
# TearFree flips whole frames, so xcompmgr (no vsync of its own) stops tearing; modesetting in
# xorg-server 21.1 has no TearFree. SNA also does xcompmgr's XRender compositing and the
# PutImage uploads of video windows (Zoom, RustDesk) without glamor's GL round trips.
# Takes effect at the next login. If X does not start: Ctrl+Alt+F2, log in,
#   sudo rm /etc/X11/xorg.conf.d/20-intel.conf && sudo systemctl restart lightdm
Section "Device"
    Identifier "Intel Graphics"
    Driver     "intel"
    Option     "AccelMethod" "sna"
    Option     "TearFree"    "true"
    Option     "DRI"         "3"
EndSection
